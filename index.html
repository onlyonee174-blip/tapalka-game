<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tapalka</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--bg-m:#f5f5f5;--bg-e:#fff;--brd:#e5e5e5;--txt:#171717;--txt-s:#525252;--acc:#2563eb;--acc-s:#eff6ff;--warn:#ea580c;--succ:#16a34a;--dang:#dc2626}
[data-theme="dark"]{--bg:#0a0a0a;--bg-m:#1f1f1f;--bg-e:#171717;--brd:#262626;--txt:#fafafa;--txt-s:#a3a3a3;--acc:#3b82f6;--acc-s:#172554;--warn:#f97316;--succ:#22c55e;--dang:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--txt);display:flex;flex-direction:column;align-items:center;padding:10px;height:100dvh;overflow:hidden;user-select:none}
.hdr{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo-m{width:24px;height:24px;border-radius:6px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.btn-i{width:34px;height:34px;border-radius:10px;border:1px solid var(--brd);background:var(--bg-e);color:var(--txt-s);cursor:pointer;display:flex;align-items:center;justify-content:center}
.score-c{width:100%;max-width:480px;padding:12px 16px;background:var(--bg-e);border:1px solid var(--brd);border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between}
.s-val{font-size:28px;font-weight:700}.s-lbl{font-size:10px;color:var(--txt-s)}
.s-stats{text-align:right;font-size:11px;color:var(--txt-s)}
.s-stats b{color:var(--acc)}
.prog{width:100%;max-width:480px;height:5px;background:var(--bg-m);border-radius:5px;margin-bottom:10px;overflow:hidden}
.prog-f{height:100%;background:var(--acc);width:0;transition:width .3s}
.tap-a{flex:1;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.hero{width:150px;height:150px;border-radius:50%;border:none;background:var(--acc);color:#fff;font-size:40px;cursor:pointer;box-shadow:0 8px 24px rgba(37,99,235,.4);transition:transform .1s}
.hero:active{transform:scale(.9)}
.tabs{width:100%;max-width:480px;display:flex;background:var(--bg-m);padding:3px;border-radius:10px;margin-bottom:10px}
.tab{flex:1;padding:6px;border:none;background:transparent;color:var(--txt-s);font-size:11px;font-weight:600;border-radius:6px;cursor:pointer}
.tab.active{background:var(--bg-e);color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.panel{width:100%;max-width:480px;display:none;flex-direction:column;gap:8px;max-height:35vh;overflow-y:auto}
.panel.active{display:flex}
.card{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg-e);border:1px solid var(--brd);border-radius:10px;cursor:pointer;text-align:left;width:100%;color:var(--txt)}
.card:disabled{opacity:.5}.card:active:not(:disabled){transform:scale(.98)}
.c-icon{font-size:20px}.c-body{flex:1}.c-name{font-size:13px;font-weight:600}.c-desc{font-size:10px;color:var(--txt-s)}.c-cost{font-size:11px;color:var(--acc);font-weight:600}
.c-lvl{font-size:11px;background:var(--bg-m);padding:2px 6px;border-radius:10px}
.crash-box{width:100%;height:100px;background:var(--bg-m);border-radius:14px;position:relative;border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden}
.rocket{position:absolute;font-size:28px;bottom:10px;left:20px;transition:all .2s}
.mult{font-size:24px;font-weight:800;color:var(--succ);z-index:10}
.grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:6px;width:100%;margin-bottom:8px}
.m-btn{aspect-ratio:1;border-radius:10px;background:var(--bg-e);border:2px solid var(--brd);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.m-btn.boom{background:#fee2e2;border-color:var(--dang);animation:shake .3s}
.m-btn.safe{background:#dcfce7;border-color:var(--succ);color:var(--succ)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.c-act{display:flex;gap:8px;width:100%}
.c-act button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:700;font-size:12px;cursor:pointer}
.b-start{background:var(--acc);color:#fff}.b-cash{background:var(--succ);color:#fff}
.c-input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--brd);background:var(--bg);color:var(--txt);text-align:center;font-weight:600;margin-bottom:8px}
.ach{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg-e);border:1px solid var(--brd);border-radius:10px;font-size:12px}
.ach.done{background:#f0fdf4}
.a-icon{font-size:16px}.a-body{flex:1}.a-name{font-weight:600}.a-prog{font-size:10px;color:var(--txt-s)}
.prof{display:flex;flex-direction:column;align-items:center;padding:20px;background:var(--bg-e);border-radius:14px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;margin-bottom:10px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.p-name{font-size:16px;font-weight:700}.p-id{font-size:12px;color:var(--txt-s);margin-bottom:14px}
.p-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.p-box{background:var(--bg-m);padding:10px;border-radius:10px;text-align:center}
.p-v{font-size:15px;font-weight:700}.p-l{font-size:10px;color:var(--txt-s)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:12px;z-index:100;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translate(-50%, 10px)}to{opacity:1;transform:translate(-50%, 0)}}
.expand-p{position:fixed;width:6px;height:6px;background:var(--acc);border-radius:50%;pointer-events:none;animation:exp .5s forwards}
@keyframes exp{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.float-t{position:fixed;color:var(--acc);font-weight:800;pointer-events:none;animation:flt .8s forwards}
@keyframes flt{to{transform:translateY(-50px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200}
.modal.show{display:flex}
.m-box{background:var(--bg-e);padding:20px;border-radius:14px;width:90%;max-width:320px;text-align:center}
.m-btn2{padding:8px;border-radius:10px;border:none;font-weight:600;cursor:pointer;margin-top:10px;width:100%}
</style>
</head>
<body>
<div class="hdr">
<div style="display:flex;align-items:center;gap:8px"><div class="logo-m">T</div><b>Tapalka</b></div>
<div style="display:flex;gap:8px">
<button class="btn-i" onclick="toggleTheme()">🌓</button>
<button class="btn-i" onclick="document.getElementById('settings').classList.add('show')">⚙️</button>
</div>
</div>
<div class="score-c">
<div><div class="s-lbl">ОЧКИ</div><div class="s-val" id="score">0</div></div>
<div class="s-stats">+<b id="pc">1</b> за клик<br><b id="cps">0</b> в секунду<br>Крит: <b id="crit" style="color:var(--warn)">10%</b></div>
</div>
<div class="prog"><div class="prog-f" id="prog"></div></div>
<div class="tap-a"><button class="hero" id="tap">🍪</button></div>
<div class="tabs">
<button class="tab active" data-t="up" onclick="tab('up')">Улучшения</button>
<button class="tab" data-t="cr" onclick="tab('cr')">🚀 Краш</button>
<button class="tab" data-t="ac" onclick="tab('ac')">🏆 Ачивки</button>
<button class="tab" data-t="pr" onclick="tab('pr')">👤 Профиль</button>
</div>
<div class="panel active" id="p-up">
<button class="card" id="u1" onclick="buy('click')"><div class="c-icon">👆</div><div class="c-body"><div class="c-name">Сила клика</div><div class="c-desc">+1 к клику</div><div class="c-cost"><span id="c1">25</span> очков</div></div><div class="c-lvl">×<span id="l1">0</span></div></button>
<button class="card" id="u2" onclick="buy('auto')"><div class="c-icon">🤖</div><div class="c-body"><div class="c-name">Автокликер</div><div class="c-desc">+1 в секунду</div><div class="c-cost"><span id="c2">15</span> очков</div></div><div class="c-lvl">×<span id="l2">0</span></div></button>
<button class="card" id="u3" onclick="buy('crit')"><div class="c-icon">🎯</div><div class="c-body"><div class="c-name">Крит шанс</div><div class="c-desc">+2% шанс ×5</div><div class="c-cost"><span id="c3">50</span> очков</div></div><div class="c-lvl">×<span id="l3">0</span></div></button>
<button class="card" id="u4" onclick="prestige()" style="border-color:var(--warn)"><div class="c-icon">⭐</div><div class="c-body"><div class="c-name">Престиж</div><div class="c-desc">Сброс за множитель</div><div class="c-cost"><span id="c4">10K</span> очков</div></div><div class="c-lvl">×<span id="l4">1.0</span></div></button>
</div>
<div class="panel" id="p-cr">
<div class="crash-box"><div class="mult" id="mult">x1.00</div><div class="rocket" id="rk">🚀</div></div>
<input type="number" class="c-input" id="bet" value="100">
<div class="grid" id="grid">
<div class="m-btn" onclick="reveal(0)"></div><div class="m-btn" onclick="reveal(1)"></div><div class="m-btn" onclick="reveal(2)"></div>
<div class="m-btn" onclick="reveal(3)"></div><div class="m-btn" onclick="reveal(4)"></div><div class="m-btn" onclick="reveal(5)"></div>
<div class="m-btn" onclick="reveal(6)"></div><div class="m-btn" onclick="reveal(7)"></div><div class="m-btn" onclick="reveal(8)"></div>
</div>
<div class="c-act"><button class="b-start" id="bStart" onclick="startCrash()">Начать</button><button class="b-cash" id="bCash" onclick="cashout()" disabled>Забрать</button></div>
</div>
<div class="panel" id="p-ac"></div>
<div class="panel" id="p-pr">
<div class="prof">
<div class="avatar" id="av">?</div>
<div class="p-name" id="pName">Игрок</div>
<div class="p-id" id="pId">@username</div>
<div class="p-stats">
<div class="p-box"><div class="p-v" id="pT">0</div><div class="p-l">Всего очков</div></div>
<div class="p-box"><div class="p-v" id="pC">0</div><div class="p-l">Кликов</div></div>
<div class="p-box"><div class="p-v" id="pP">0</div><div class="p-l">Престижей</div></div>
<div class="p-box"><div class="p-v" id="pA">0/11</div><div class="p-l">Достижений</div></div>
</div>
</div>
</div>
<div class="modal" id="settings">
<div class="m-box">
<h3>Настройки</h3>
<p style="margin:10px 0">Звуки: <button id="snd" onclick="toggleSnd()">Вкл</button></p>
<button class="m-btn2" style="background:var(--dang);color:#fff" onclick="reset()">Сбросить игру</button>
<button class="m-btn2" style="background:var(--bg-m);color:var(--txt);margin-top:5px" onclick="document.getElementById('settings').classList.remove('show')">Закрыть</button>
</div>
</div>
<div class="modal" id="conf">
<div class="m-box">
<p id="cText">Вы уверены?</p>
<button class="m-btn2" style="background:var(--warn);color:#fff" id="cYes">Да</button>
<button class="m-btn2" style="background:var(--bg-m);color:var(--txt)" id="cNo">Нет</button>
</div>
</div>
<script>
const tg = window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
let S = { score:0, total:0, clicks:0, cl:0, al:0, cr:0, pr:0, cp:1, cc:10, theme:'light', snd:true, a:{}, combo:0, crash:false, bet:0, safe:0, mines:[] };
let audio;
try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
function snd(f,d=0.05){if(!S.snd||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=0.05;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function fmt(n){n=Math.floor(n);if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n}
function calc(){S.cp=Math.floor((1+S.cl)*(1+S.pr*0.5));S.cc=10+S.cr*2;}
let cb=null;
function ask(t,f){document.getElementById('cText').innerText=t;document.getElementById('conf').classList.add('show');cb=f}
document.getElementById('cYes').onclick=()=>{document.getElementById('conf').classList.remove('show');if(cb)cb()}
document.getElementById('cNo').onclick=()=>document.getElementById('conf').classList.remove('show');
function save(){try{localStorage.setItem('tap_v5',JSON.stringify(S));if(tg&&tg.CloudStorage)tg.CloudStorage.setItem('tap_v5',JSON.stringify(S),()=>{})}catch(e){}}
function load(){try{let d=localStorage.getItem('tap_v5');if(d)Object.assign(S,JSON.parse(d))}catch(e){}calc()}
function ui(){
document.getElementById('score').innerText=fmt(S.score);
document.getElementById('pc').innerText=fmt(S.cp);
document.getElementById('cps').innerText=fmt(Math.floor(S.al*(1+S.pr*0.5)));
document.getElementById('crit').innerText=S.cc+'%';
document.getElementById('c1').innerText=fmt(Math.floor(25*Math.pow(1.55,S.cl)));
document.getElementById('c2').innerText=fmt(Math.floor(15*Math.pow(1.6,S.al)));
document.getElementById('c3').innerText=fmt(Math.floor(50*Math.pow(1.8,S.cr)));
document.getElementById('c4').innerText=fmt(Math.floor(10000*Math.pow(3,S.pr)));
document.getElementById('l1').innerText=S.cl;document.getElementById('l2').innerText=S.al;document.getElementById('l3').innerText=S.cr;document.getElementById('l4').innerText=(1+S.pr*0.5).toFixed(1);
document.getElementById('u1').disabled=S.score<Math.floor(25*Math.pow(1.55,S.cl));
document.getElementById('u2').disabled=S.score<Math.floor(15*Math.pow(1.6,S.al));
document.getElementById('u3').disabled=S.score<Math.floor(50*Math.pow(1.8,S.cr));
document.getElementById('u4').disabled=S.score<Math.floor(10000*Math.pow(3,S.pr));
let min=Math.min(Math.floor(25*Math.pow(1.55,S.cl)),Math.floor(15*Math.pow(1.6,S.al)),Math.floor(50*Math.pow(1.8,S.cr)));
document.getElementById('prog').style.width=Math.min(100,(S.score/min)*100)+'%';
document.getElementById('pT').innerText=fmt(S.total);document.getElementById('pC').innerText=fmt(S.clicks);document.getElementById('pP').innerText=S.pr;document.getElementById('pA').innerText=Object.keys(S.a).length+'/11';
if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user){let u=tg.initDataUnsafe.user;document.getElementById('pName').innerText=(u.first_name||'')+' '+(u.last_name||'');document.getElementById('pId').innerText=u.username?'@'+u.username:'ID: '+u.id;if(u.photo_url)document.getElementById('av').innerHTML=`<img src="${u.photo_url}">`;else document.getElementById('av').innerText=(u.first_name||'?')[0].toUpperCase();}
}
function toast(t){let d=document.createElement('div');d.className='toast';d.innerText=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
function part(x,y,w,d){for(let i=0;i<4;i++){let p=document.createElement('div');p.className='expand-p';p.style.left=x+'px';p.style.top=y+'px';p.style.background=w?'var(--warn)':d?'var(--dang)':'var(--acc)';let a=Math.random()*6.28,ds=50+Math.random()*50;p.style.setProperty('--dx',Math.cos(a)*ds+'px');p.style.setProperty('--dy',Math.sin(a)*ds+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),500)}}
function flt(x,y,t,w){let d=document.createElement('div');d.className='float-t';d.innerText=t;d.style.left=x+'px';d.style.top=y+'px';d.style.color=w?'var(--warn)':'var(--acc)';document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
document.getElementById('tap').onpointerdown=(e)=>{
snd(600);S.combo++;setTimeout(()=>S.combo=0,1000);
let crit=Math.random()*100<S.cc,m=1;if(S.combo>=10)m=1.5;if(S.combo>=20)m=2;if(S.combo>=30)m=3;
let g=Math.floor(S.cp*m);if(crit){g*=5;snd(1200);}
S.score+=g;S.total+=g;S.clicks++;
part(e.clientX,e.clientY,crit);flt(e.clientX,e.clientY,'+'+g,crit);
ui();check();save();
};
function buy(k){
let c=k=='click'?Math.floor(25*Math.pow(1.55,S.cl)):k=='auto'?Math.floor(15*Math.pow(1.6,S.al)):Math.floor(50*Math.pow(1.8,S.cr));
if(S.score<c)return;S.score-=c;
if(k=='click')S.cl++;if(k=='auto')S.al++;if(k=='crit')S.cr++;
calc();snd(800);ui();save();check();
}
function prestige(){
let c=Math.floor(10000*Math.pow(3,S.pr));if(S.score<c)return;
ask('Сбросить прогресс за множитель ×'+(1+(S.pr+1)*0.5).toFixed(1)+'?',()=>{
S.pr++;S.score=0;S.cl=0;S.al=0;S.cr=0;calc();ui();save();toast('Престиж!');
});
}
setInterval(()=>{if(S.al>0){let g=Math.floor(S.al*(1+S.pr*0.5));S.score+=g;S.total+=g;ui();}},1000);
function startCrash(){
let b=parseInt(document.getElementById('bet').value);
if(isNaN(b)||b<10)return toast('Мин. 10');if(b>S.score)return toast('Мало очков');
S.crash=true;S.bet=b;S.safe=0;S.score-=b;S.mines=[];
while(S.mines.length<3){let r=Math.floor(Math.random()*9);if(!S.mines.includes(r))S.mines.push(r);}
document.querySelectorAll('.m-btn').forEach(x=>{x.className='m-btn';x.innerText=''});
document.getElementById('bStart').disabled=true;document.getElementById('bCash').disabled=false;
document.getElementById('bCash').innerText='Забрать x1.0';
document.getElementById('rk').style.bottom='10px';document.getElementById('rk').style.left='20px';
document.getElementById('mult').innerText='x1.00';document.getElementById('mult').style.color='var(--succ)';
ui();
}
function reveal(i){
if(!S.crash)return;let btn=document.querySelectorAll('.m-btn')[i];
if(btn.className.includes('safe')||btn.className.includes('boom'))return;
if(S.mines.includes(i)){
btn.className='m-btn boom';btn.innerText='💥';S.crash=false;
document.getElementById('bStart').disabled=false;document.getElementById('bCash').disabled=true;
document.querySelectorAll('.m-btn').forEach((b,idx)=>{if(S.mines.includes(idx)&&idx!==i){b.className='m-btn boom';b.innerText='💥';}});
document.getElementById('rk').innerText='💥';document.getElementById('mult').innerText='ВЗРЫВ';document.getElementById('mult').style.color='var(--dang)';
snd(150);toast('Взрыв! -'+S.bet);ui();
}else{
btn.className='m-btn safe';btn.innerText='💎';S.safe++;snd(800+S.safe*100);
let m=1+S.safe*0.5;document.getElementById('bCash').innerText='Забрать x'+m.toFixed(1);
document.getElementById('rk').style.bottom=(10+S.safe*12)+'px';document.getElementById('rk').style.left=(20+S.safe*20)+'px';
document.getElementById('mult').innerText='x'+m.toFixed(2);
if(S.safe===6)cashout();
}
}
function cashout(){
if(!S.crash||S.safe===0)return;let m=1+S.safe*0.5;let w=Math.floor(S.bet*m);
S.score+=w;S.total+=w;S.crash=false;
document.getElementById('bStart').disabled=false;document.getElementById('bCash').disabled=true;
snd(1000);toast('Забрано '+w);ui();check();save();
}
const ACH=[{id:'1',n:'Первый клик',i:'👆',t:1,c:s=>s.clicks},{id:'2',n:'100 кликов',i:'💪',t:100,c:s=>s.clicks},{id:'3',n:'1000 кликов',i:'🔥',t:1000,c:s=>s.clicks},{id:'4',n:'100 очков',i:'🍪',t:100,c:s=>s.total},{id:'5',n:'1000 очков',i:'🏆',t:1000,c:s=>s.total},{id:'6',n:'10K очков',i:'💎',t:10000,c:s=>s.total},{id:'7',n:'Сила ×5',i:'⚡',t:5,c:s=>s.cl},{id:'8',n:'Авто-фабрика',i:'🤖',t:5,c:s=>s.al},{id:'9',n:'Снайпер',i:'🎯',t:5,c:s=>s.cr},{id:'10',n:'Комбо ×10',i:'🔥',t:10,c:s=>s.combo},{id:'11',n:'Первый престиж',i:'⭐',t:1,c:s=>s.pr}];
function check(){let u=false;for(let a of ACH){if(!S.a[a.id]&&a.c(S)>=a.t){S.a[a.id]=true;toast('Достижение: '+a.n);u=true;}}if(u){save();rAch();ui();}}
function rAch(){let l=document.getElementById('p-ac');l.innerHTML='';for(let a of ACH){let d=S.a[a.id],c=a.c(S),p=Math.min(100,Math.floor(c/a.t*100));let el=document.createElement('div');el.className='ach'+(d?' done':'');el.innerHTML=`<div class="a-icon">${d?'✓':a.i}</div><div class="a-body"><div class="a-name">${a.n}</div><div class="a-prog">${d?'Получено':c+' / '+a.t}</div></div>`;l.appendChild(el);}}
function tab(n){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelector(`.tab[data-t="${n}"]`).classList.add('active');document.getElementById('p-'+n).classList.add('active');if(n==='ac')rAch();}
function toggleTheme(){S.theme=S.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',S.theme);save();}
function toggleSnd(){S.snd=!S.snd;document.getElementById('snd').innerText=S.snd?'Вкл':'Выкл';save();}
function reset(){ask('Сбросить весь прогресс?',()=>{S={score:0,total:0,clicks:0,cl:0,al:0,cr:0,pr:0,cp:1,cc:10,theme:S.theme,snd:S.snd,a:{},combo:0,crash:false,bet:0,safe:0,mines:[]};calc();ui();rAch();save();document.getElementById('settings').classList.remove('show');toast('Сброшено');});}
load();ui();rAch();
setInterval(save,3000);
</script>
</body>
</html>
